name: Build Shirox TV and Movie Catalog IPA (Unsigned)
on:
  push:
    branches:
      - feature/smart-playback-recovery-20261021
    paths:
      - ".github/workflows/build-player-test-ipa-20261024.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Build unsigned iPhone IPA with live-action catalog and session improvements
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9a7ace2fc9947d94a75470b31759f7234e33734
      - name: Show exact source revision
        run: |
          echo "Building git commit: $(git rev-parse HEAD)"
          echo "Branch: $GITHUB_REF_NAME"
          xcodebuild -version
          test "$GITHUB_REF_NAME" = "feature/smart-playback-recovery-20261021"
          test "$(git rev-parse HEAD)" = "a9a7ace2fc9947d94a75470b31759f7234e33734"
      - name: Build unsigned iPhone IPA using existing project script
        run: |
          chmod +x ./buildipa.sh
          ./buildipa.sh
      - name: Verify IPA structure and record checksum
        run: |
          test -s build/Shirox.ipa
          unzip -tq build/Shirox.ipa
          unzip -Z1 build/Shirox.ipa | grep -E '^Payload/[^/]+\.app/' >/dev/null
          shasum -a 256 build/Shirox.ipa | tee build/Shirox.ipa.sha256
          ls -lh build/Shirox.ipa
      - name: Upload test IPA as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shirox-Playback-Test-IPA
          path: |
            build/Shirox.ipa
            build/Shirox.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish convenient prerelease download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tv-movie-catalog-a9a7ace2fc99"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "a9a7ace2fc9947d94a75470b31759f7234e33734" \
            --title "Shirox TV and Movie Catalog (unsigned) a9a7ace" \
            --notes "Unsigned iOS test IPA from source commit a9a7ace2fc9947d94a75470b31759f7234e33734. Adds TVmaze series and Apple movie catalog search with season lists, keeps manually verified source sessions on same-module reload, and includes prior player and skip fixes. Requires signing before iPhone installation. Live hoster and playback behavior need real-device testing." \
            --prerelease
          gh release upload "$TAG" build/Shirox.ipa build/Shirox.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
