name: Build Shirox Gesture Fix IPA (Unsigned)
on:
  push:
    branches:
      - feature/smart-playback-recovery-20261021
    paths:
      - ".github/workflows/build-player-test-ipa-20261024.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Build unsigned iPhone IPA with gesture and intro outro fixes
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b69f53eb3bbf1fcee7e4513c63a52a7ce1f819c
      - name: Show exact source revision
        run: |
          echo "Building git commit: $(git rev-parse HEAD)"
          echo "Branch: $GITHUB_REF_NAME"
          xcodebuild -version
          test "$GITHUB_REF_NAME" = "feature/smart-playback-recovery-20261021"
          test "$(git rev-parse HEAD)" = "3b69f53eb3bbf1fcee7e4513c63a52a7ce1f819c"
      - name: Build unsigned iPhone IPA using existing project script
        run: |
          chmod +x ./buildipa.sh
          ./buildipa.sh
      - name: Verify IPA structure and record checksum
        run: |
          test -s build/Shirox.ipa
          unzip -tq build/Shirox.ipa
          unzip -Z1 build/Shirox.ipa | grep -E '^Payload/[^/]+\.app/' >/dev/null
          shasum -a 256 build/Shirox.ipa | tee build/Shirox.ipa.sha256
          ls -lh build/Shirox.ipa
      - name: Upload test IPA as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shirox-Playback-Test-IPA
          path: |
            build/Shirox.ipa
            build/Shirox.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish convenient prerelease download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="gesture-fix-3b69f53eb3bb"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "3b69f53eb3bbf1fcee7e4513c63a52a7ce1f819c" \
            --title "Shirox Swipe Gesture Fix (unsigned) 3b69f53" \
            --notes "Unsigned iOS test IPA from source commit 3b69f53eb3bbf1fcee7e4513c63a52a7ce1f819c. Removes conflicting fullscreen swipe-to-dismiss pan so vertical swipes adjust brightness or volume without closing playback. Includes Kuroko season-aware intro/outro markers and all prior Continue Watching fixes. Requires signing before iPhone installation. Live hoster and playback behavior need real-device testing." \
            --prerelease
          gh release upload "$TAG" build/Shirox.ipa build/Shirox.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
