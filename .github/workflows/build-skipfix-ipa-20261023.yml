name: Build Tested Skip-Fix IPA
on:
  push:
    branches:
      - feature/smart-playback-recovery-20261021
    paths:
      - ".github/workflows/build-skipfix-ipa-20261023.yml"
permissions:
  contents: write
jobs:
  ipa:
    name: Compile and publish tested Shirox build
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout exact tested Shirox commit
        uses: actions/checkout@v4
        with:
          ref: d838fadac168765c6b9ba02e7ebf4ae1c259977c
      - name: Confirm exact tested source
        run: |
          test "$(git rev-parse HEAD)" = "d838fadac168765c6b9ba02e7ebf4ae1c259977c"
          xcodebuild -version
      - name: Build unsigned iOS IPA
        run: |
          chmod +x buildipa.sh
          ./buildipa.sh
      - name: Validate actual IPA file and payload
        run: |
          test -s build/Shirox.ipa
          unzip -tq build/Shirox.ipa
          unzip -Z1 build/Shirox.ipa | grep -E '^Payload/[^/]+\.app/' >/dev/null
          shasum -a 256 build/Shirox.ipa
          ls -lh build/Shirox.ipa
      - name: Attach validated IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shirox-IntroSkip-AutoNext-20261023
          path: build/Shirox.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct IPA release download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create skipfix-20261023 \
            --repo sohailzmn/Shirox \
            --target d838fadac168765c6b9ba02e7ebf4ae1c259977c \
            --title "Shirox · Intro Skip + Auto Next Fix (23 Oct 2026)" \
            --notes "Unsigned Shirox IPA built from the exact commit d838fadac168765c6b9ba02e7ebf4ae1c259977c that passed iOS simulator compilation and 15 timing unit tests in https://github.com/sohailzmn/Shirox/actions/runs/39885017146. Includes fast AniSkip cue fetching, independently verified OP/ED markers, prefetch and auto-next retry. Sign the IPA before installing on an iPhone." \
            --prerelease
          gh release upload skipfix-20261023 build/Shirox.ipa \
            --repo sohailzmn/Shirox --clobber
