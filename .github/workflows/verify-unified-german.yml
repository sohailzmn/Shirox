name: Verify Shirox unified German integration
on:
  pull_request:
    branches:
      - main
      - feature/smart-playback-recovery-20261021
  workflow_dispatch:
    inputs:
      runner_image:
        description: Standard hosted Mac image
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
jobs:
  build-ios:
    runs-on: ${{ inputs.runner_image || 'macos-26' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select compatible Xcode on the fallback image
        if: inputs.runner_image == 'macos-15'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Build iOS IPA without signing
        run: |
          chmod +x ./buildipa.sh
          ./buildipa.sh
      - name: Upload test IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shirox-Unified-GER-test-IPA
          path: build/Shirox.ipa
          if-no-files-found: ignore
